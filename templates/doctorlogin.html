<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background:
        linear-gradient(rgba(0, 51, 102, 0.7), rgba(0, 51, 102, 0.7)),
        url('https://images.unsplash.com/photo-1505751172876-fa1923c5c528?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px 45px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      width: 360px;
      text-align: center;
    }

    h2 {
      margin-bottom: 30px;
      color: #003366;
      font-weight: 600;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1.5px solid #007bff;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: #0056b3;
      outline: none;
    }

    input[type="submit"] {
      background-color: #007bff;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      letter-spacing: 0.7px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    .error {
      color: #d93025;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .link {
      margin-top: 15px;
      font-weight: 600;
    }

    .link a {
      color: #007bff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .link a:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Doctor Login</h2>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="POST" action="/doctorlogin">
    <input type="text" name="doctor_username" placeholder="Username" required />
    <input type="password" name="doctor_password" placeholder="Password" required />
    <select name="doctor_location" required>
      <option value="">-- Select Location --</option>
      <option value="Chennai">Chennai</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Bangalore">Bangalore</option>
      <option value="Delhi">Delhi</option>
    </select>
    <input type="submit" value="Login" />
  </form>

  <div class="link">
    Not registered? <a href="/doctorregister">Register here</a>
  </div>
</div>

</body>
</html>
