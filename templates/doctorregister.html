<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Registration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: 
        linear-gradient(rgba(0, 51, 102, 0.7), rgba(0, 51, 102, 0.7)),
        url('https://images.unsplash.com/photo-1576765607924-0a945213ab4c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px 45px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      width: 360px;
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 30px;
      color: #003366;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .login-container input,
    .login-container select,
    .login-container button {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1.5px solid #007bff;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }

    .login-container input:focus,
    .login-container select:focus {
      border-color: #0056b3;
      outline: none;
    }

    .login-container button {
      background-color: #007bff;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      letter-spacing: 0.7px;
      transition: background-color 0.3s ease;
    }

    .login-container button:hover {
      background-color: #0056b3;
    }

    .login-container .error-message {
      color: #d93025;
      margin-top: 12px;
      font-size: 14px;
    }

    .login-container .login-link {
      margin-top: 15px;
      font-weight: 600;
    }

    .login-container .login-link a {
      color: #007bff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .login-container .login-link a:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Doctor Registration</h2>
  <form method="POST" action="/doctorregister">
    <input type="text" name="doctor_username" placeholder="Username" required />
    <input type="password" name="doctor_password" placeholder="Password" required />

    <select name="doctor_location" required>
      <option value="">-- Select Location --</option>
      <option value="Chennai">Chennai</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Bangalore">Bangalore</option>
      <option value="Delhi">Delhi</option>
    </select>

    <button type="submit">Register</button>
  </form>

  <div class="login-link">
    Already registered? <a href="/doctorlogin">Login here</a>
  </div>

  {% if error %}
    <p class="error-message">{{ error }}</p>
  {% endif %}
</div>

</body>
</html>
