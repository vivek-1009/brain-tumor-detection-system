<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
  <div class="container mt-5">
    <h2 class="text-center mb-4">📝 Book Your Appointment</h2>
    <form method="POST" action="/confirm-appointment" class="bg-light text-dark p-4 rounded shadow">
      
      <!-- Doctor Info (readonly) -->
      <div class="mb-3">
        <label class="form-label">Doctor Name</label>
        <input type="text" class="form-control" name="doctor_name" value="{{ name }}" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label">Doctor Location</label>
        <input type="text" class="form-control" name="doctor_location" value="{{ location }}" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label">Doctor Contact</label>
        <input type="text" class="form-control" name="doctor_contact" value="{{ contact }}" readonly>
      </div>

      <!-- User Input -->
      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-control" name="user_name" placeholder="Enter your full name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Your Location</label>
        <input type="text" class="form-control" name="user_location" placeholder="Enter your location" required>
      </div>

      <!-- Date & Time -->
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" class="form-control" name="date" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Time</label>
        <input type="time" class="form-control" name="time" required>
      </div>

      <button type="submit" class="btn btn-success w-100">✅ Book My Appointment</button>
    </form>
  </div>
</body>
</html>
