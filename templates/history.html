<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detection History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tooltip-text {
            cursor: pointer;
            text-decoration: underline dotted;
        }
    </style>
</head>
<body class="bg-white">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Prediction History / भविष्यवाणी इतिहास</h2>
        <div>
            <a href="/download-history/pdf" class="btn btn-outline-secondary me-2">Download PDF / पीडीएफ</a>
            <a href="/download-history/csv" class="btn btn-outline-secondary me-2">Download CSV / सीएसवी</a>
            <a href="/logout" class="btn btn-danger">Logout / लॉगआउट</a>
        </div>
    </div>

    <table class="table table-striped mt-4">
        <thead>
        <tr>
            <th>#</th>
            <th>Username</th>
            <th>Timestamp</th>
            <th>AI Prediction</th>
            <th>Confidence</th>
        </tr>
        </thead>
        <tbody>
        {% for row in history %}
            <tr>
                <td>{{ row[0] }}</td> <!-- ID -->
                <td>{{ row[1] }}</td> <!-- Username -->
                <td>{{ row[2] }}</td> <!-- Timestamp -->
                <td>{{ row[3] }}</td> <!-- AI Prediction -->
                <td>{{ row[4] }}%</td> <!-- Confidence -->
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
